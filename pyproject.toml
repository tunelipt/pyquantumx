[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyquantumx"
version = "0.1.0"
description = "Python access to HBM QuantumX modules through HBM's legacy QuantumX .NET API (pythonnet)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.7,<3.14"
dependencies = [
    "pythonnet>=3.0.5",
    "numpy<2.6",
]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/tunelipt/pyquantumx"

[tool.setuptools]
packages = ["pyquantumx"]
